services:
  db:
    image: postgres:17-alpine
    container_name: teambrain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teambrain
      POSTGRES_PASSWORD: teambrain
      POSTGRES_DB: teambrain
    ports:
      - "5432:5432"
    volumes:
      - teambrain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teambrain -d teambrain"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teambrain-pgdata:
